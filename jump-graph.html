 const byLock={};inC.forEach(e=>{(byLock[e.lock]=byLock[e.lock]||[]).push(e);});
 document.getElementById('panel').innerHTML='<h2>'+esc(n.num+' '+n.name)+'</h2><p class="muted"><span class="tag">'+KIND[n.kind]+'</span>'+esc(n.lane)+'　<code>'+esc(n.url)+'</code>'+(n.state?'<br>'+esc(n.state):'')+(n.note?'<br>'+esc(n.note):'')+'</p>'
  +(n.entry==='url'?'<h3>实线入度：0 ✓（没有任何链接通到这里）</h3><p class="muted">只能在 Edge 地址栏输入网址。下面“虚线入度”里的线索就是它的入口：网址从哪来、为什么能直接输。</p>':'<h3>实线入度（唯一入口）'+(n.kind==='root'?'':inN.length===1?' ✓':' <span class="bad">✗ '+inN.length+' 条</span>')+'</h3>'+(inN.length?'<ul>'+inN.map(e=>navLi(e,true)).join('')+'</ul>':'<p class="muted">根节点：开场介绍给了开机密码 0714。</p>'))
  +'<h3>实线出度（能打开哪里）</h3>'+(outN.length?'<ul>'+outN.map(e=>navLi(e,false)).join('')+'</ul>':'<p class="muted">无</p>')
  +'<h3>虚线出度（本页提供的必要线索）</h3>'+(outC.length?'<ul>'+outC.map(e=>clueLi(e,false)).join('')+'</ul>':'<p class="muted">无</p>')
  +'<h3>虚线入度（打开本页要用的线索）</h3>'+(inC.length?Object.keys(byLock).map(l=>'<p>'+lockLine(l)+'</p><ul>'+byLock[l].map(e=>clueLi(e,true)).join('')+'</ul>').join(''):'<p class="muted">无</p>');}
function intro(){document.getElementById('panel').innerHTML='<h2>怎么看</h2><p>点任意页面：右边列出它<b>唯一的实线入口</b>、能打开的页面、它提供的必要线索（解开哪一页、哪个输入项、什么值），以及打开它需要的线索。</p><p>每个方块最后一行：<b>入</b>＝实线入度（绿色＝恰好 1），<b>出</b>＝实线出度／虚线出度。</p><h3>判定口径</h3><p>'+esc(D.rule)+'</p><p class="muted">背景、印证、动机、读过就自动弹出的消息都不画成虚线；节奏门槛（比如读过某份笔录才出现的问题）写在实线的“条件”里。</p><h3>本轮改动</h3><ul>'+CHANGES.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul><p class="muted">完整表格：点页头“表格”。</p>';}
function tables(){const pages=D.nodes.slice().sort((a,b)=>a.num.localeCompare(b.num));
 let h='<h2>节奏：每一步新开出来的内容页</h2><p class="muted">一页排在第几步＝它的上一页、打开它要用的线索出处、节奏前置里最晚的那一个再加一（操作界面也占一步）。只列内容页、卷宗和结局。</p><table><tr><th>步</th><th>页数</th><th>新开的页面</th></tr>'+D.pacing.filter(r=>r.pages.length).map(r=>'<tr><td class="n">'+(r.step===D.lastCol?'结局':'第 '+r.step+' 步')+'</td><td class="n">'+r.pages.length+'</td><td>'+r.pages.map(id=>esc(by[id].num+' '+by[id].name)).join('、')+'</td></tr>').join('')+'</table>';
 h+='<h2>逐页检查（'+pages.length+' 个页面）</h2><table><tr><th>编号</th><th>页面</th><th>唯一入口（实线入度）</th><th>实线出度</th><th>必要线索出度（解开哪一页：输入项＝值）</th></tr>';
 for(const n of pages){const i=D.navigation.filter(e=>e.to===n.id),o=D.navigation.filter(e=>e.from===n.id),c=D.clues.filter(e=>e.from===n.id);
  h+='<tr><td class="n">'+n.num+'</td><td>'+esc(n.name)+'<div class="muted">'+KIND[n.kind]+'</div></td><td>'+(n.kind==='root'?'（根）':n.entry==='url'?'（没有链接，地址栏输入网址）<br>'+D.clues.filter(e=>e.to===n.id).map(e=>'⇢ '+esc(by[e.from].num+' '+by[e.from].name)+'：'+esc(e.field)+'＝'+esc(e.value)).join('<br>'):i.map(e=>esc(by[e.from].num+' '+by[e.from].name)+'：'+esc(e.label)+(e.lock?'〔'+esc(lk[e.lock].title)+'〕':'')).join('<br>'))+(n.kind!=='root'&&n.entry!=='url'&&i.length!==1?' <b class="bad">✗</b>':'')+'</td><td>'+(o.map(e=>esc(by[e.to].num+' '+by[e.to].name)).join('<br>')||'—')+'</td><td>'+(c.map(e=>esc(by[e.to].num+' '+by[e.to].name)+'：'+esc(e.field)+'＝'+esc(e.value)).join('<br>')||(n.kind==='ending'?'（结局）':n.kind==='atmo'?'（气氛页，按设计没有出度）':o.length?'—':'<b class="bad">无出度</b>'))+'</td></tr>';}
 h+='</table><h2>锁与钥匙（'+D.locks.length+' 把）</h2><table><tr><th>锁</th><th>在哪输入</th><th>打开</th><th>输入项＝值</th><th>线索来源（页面：原文）</th></tr>';
 for(const L of D.locks){const opens=D.navigation.filter(e=>e.lock===L.id).map(e=>by[e.to].num+' '+by[e.to].name).concat((L.opens||[]).map(id=>by[id].num+' '+by[id].name+'（地址栏直达）'));const src=D.clues.filter(e=>e.lock===L.id);
  h+='<tr><td>'+esc(L.title)+'</td><td>'+esc(by[L.at].num+' '+by[L.at].name)+'</td><td>'+opens.map(esc).join('<br>')+'</td><td>'+L.fields.map(f=>esc(f[0])+'＝'+esc(f[1])).join('<br>')+'</td><td>'+src.map(e=>esc(by[e.from].num+' '+by[e.from].name)+'：「'+esc(e.quote)+'」→ '+esc(e.field)).join('<br>')+'</td></tr>';}
 h+='</table><h2>不算入口的通用操作</h2><table><tr><th>操作</th><th>为什么不算</th></tr>'+D.exempt.map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td></tr>').join('')+'</table>';
 h+='<h2>审计</h2><p>'+(D.audit.errors.length?'<b class="bad">'+D.audit.errors.length+' 个错误</b><br>'+D.audit.errors.map(esc).join('<br>'):'通过：每页实线入度恰好 1；没有无出度页面；'+D.clues.length+' 条虚线都绑定锁、输入项和值，指向被它解开的页面，原文逐字段核对；关键值只有一个出处。')+'</p>';
 document.getElementById('tables').innerHTML=h;}
const p=document.getElementById('pick');D.nodes.slice().sort((a,b)=>a.num.localeCompare(b.num)).forEach(n=>{const o=document.createElement('option');o.value=n.id;o.textContent=n.num+' '+n.name;p.appendChild(o);});
p.onchange=()=>{if(!p.value)return;document.body.classList.remove('tables');select(p.value);const n=by[p.value];document.getElementById('view').scrollTo(n.x*scale-120,n.y*scale-100);};
const A=D.audit;document.getElementById('summary').innerHTML='页面 '+A.total+'（内容页 '+A.pages+'，含卷宗 '+A.documents+'；操作界面 '+A.interfaces+'；结局 '+A.endings+'）｜实线 '+D.navigation.length+'｜虚线 '+D.clues.length+'｜锁 '+D.locks.length+'｜实线入度≠1：<b class="'+(A.inDegreeOk?'ok':'bad')+'">'+(A.inDegreeOk?0:'有')+'</b>'+((A.urlOnly||[]).length?'（另有 '+A.urlOnly.length+' 页按设计只有虚线入口：'+esc(A.urlOnly.map(x=>x.split(' ')[0]).map(id=>by[id].num+' '+by[id].name).join('、'))+'）':'')+'｜无出度：<b class="'+(A.dead.length?'bad':'ok')+'">'+A.dead.length+'</b>'+((A.atmo||[]).length?'（另有 '+A.atmo.length+' 个气氛页按设计没有出度）':'')+'｜审计错误：<b class="'+(A.errors.length?'bad':'ok')+'">'+A.errors.length+'</b>';
document.getElementById('reset').onclick=()=>{document.querySelectorAll('.dim,.on,.selected').forEach(x=>x.classList.remove('dim','on','selected'));intro();};
document.getElementById('nav').onclick=()=>{document.body.className='navonly';};document.getElementById('clue').onclick=()=>{document.body.className='clueonly';};
document.getElementById('all').onclick=()=>{document.body.className='';scale=.72;size();};document.getElementById('tab').onclick=()=>{document.body.classList.toggle('tables');};
document.getElementById('plus').onclick=()=>{scale=Math.min(2,scale*1.2);size();};document.getElementById('minus').onclick=()=>{scale=Math.max(.2,scale/1.2);size();};
size();intro();tables();{const hs=decodeURIComponent(location.hash.slice(1));const hn=by[hs]||D.nodes.find(n=>n.num===hs);if(hn){select(hn.id);document.getElementById('view').scrollTo(hn.x*scale-160,hn.y*scale-140);}}
</script></body></html>
